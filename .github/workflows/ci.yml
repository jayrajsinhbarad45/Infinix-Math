name: Infinix Math CI & Multi-Platform App Builder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Validate Python FastAPI & SymPy Engine
  # -------------------------------------------------------------
  backend-tests:
    name: Backend Test Suite (SymPy CAS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install pytest pytest-asyncio httpx python-docx

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests -v
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci_mock_test_key_placeholder' }}
          ENVIRONMENT: test

  # -------------------------------------------------------------
  # Job 2: Build Next.js Web App
  # -------------------------------------------------------------
  web-build:
    name: Web App Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          CI: true

  # -------------------------------------------------------------
  # Job 3: Build Android APK Package (.apk)
  # -------------------------------------------------------------
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest
    needs: [backend-tests, web-build]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Web Export
        run: npm run build
        env:
          CI: true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfinixMath-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # -------------------------------------------------------------
  # Job 4: Build Windows Desktop App (.exe)
  # -------------------------------------------------------------
  build-windows-exe:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest
    needs: [backend-tests, web-build]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Web Export
        run: npm run build
        env:
          CI: true

      - name: Package Windows Executable with Electron
        run: npm run build:electron

      - name: Upload Windows Desktop Artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: InfinixMath-Windows-EXE
          path: frontend/dist/*.exe
          retention-days: 14
