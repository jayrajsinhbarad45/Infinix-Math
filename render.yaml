services:
  - type: web
    name: infinix-math-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: MOCK_GEMINI_FALLBACK
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
